```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elie3MDigital</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* CONNEXION */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.loginBox{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px #0002;
}

.loginBox h1{
    text-align:center;
    margin-top:0;
}

.formGroup{
    margin-bottom:15px;
}

.formGroup label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.formGroup input,
.formGroup select,
.formGroup textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

.primaryButton{
    width:100%;
    border:0;
    border-radius:8px;
    padding:13px;
    background:#2563eb;
    color:white;
    font-weight:bold;
}

.message{
    margin-top:12px;
    text-align:center;
}

/* APPLICATION */

#app{
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

header h1{
    margin:0;
    font-size:20px;
}

.logout{
    background:#dc2626;
    color:white;
    border:0;
    border-radius:7px;
    padding:9px 14px;
}

.layout{
    display:flex;
    min-height:calc(100vh - 60px);
}

nav{
    width:220px;
    background:white;
    border-right:1px solid #ddd;
    padding:15px;
}

nav button{
    width:100%;
    border:0;
    border-radius:8px;
    padding:12px;
    margin-bottom:8px;
    background:#f1f5f9;
    text-align:left;
}

main{
    flex:1;
    padding:20px;
    min-width:0;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 10px #0001;
}

.card h3{
    margin-top:0;
}

.stat{
    font-size:30px;
    font-weight:bold;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.add{
    border:0;
    border-radius:8px;
    padding:11px 15px;
    background:#16a34a;
    color:white;
}

.search{
    width:100%;
    max-width:450px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.edit{
    background:#f59e0b;
    color:white;
    border:0;
    border-radius:7px;
    padding:9px 12px;
}

.delete{
    background:#dc2626;
    color:white;
    border:0;
    border-radius:7px;
    padding:9px 12px;
}

.empty{
    background:white;
    border-radius:10px;
    padding:20px;
}

/* MODALES */

.modal{
    position:fixed;
    inset:0;
    background:#0008;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.active{
    display:flex;
}

.modalBox{
    background:white;
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    border-radius:14px;
    padding:25px;
}

.modalButtons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.modalButtons button{
    flex:1;
    padding:11px;
    border:0;
    border-radius:8px;
}

.save{
    background:#2563eb;
    color:white;
}

.cancel{
    background:#e5e7eb;
}

@media(max-width:700px){

    .layout{
        display:block;
    }

    nav{
        width:100%;
        display:flex;
        overflow-x:auto;
        gap:8px;
    }

    nav button{
        min-width:115px;
        text-align:center;
        margin:0;
    }

    main{
        padding:15px;
    }

    header h1{
        font-size:17px;
    }
}
</style>
</head>

<body>

<!-- CONNEXION -->

<section id="loginPage">

<div class="loginBox">

<h1>Elie3MDigital</h1>

<p style="text-align:center">
Connexion
</p>

<form id="loginForm">

<div class="formGroup">

<label for="email">
E-mail
</label>

<input
id="email"
type="email"
autocomplete="username"
required
>

</div>

<div class="formGroup">

<label for="password">
Mot de passe
</label>

<input
id="password"
type="password"
autocomplete="current-password"
required
>

</div>

<button
class="primaryButton"
type="submit"
>
Se connecter
</button>

</form>

<div
id="loginMessage"
class="message"
></div>

</div>

</section>


<!-- APPLICATION -->

<section
id="app"
class="hidden"
>

<header>

<h1>
Elie3MDigital
</h1>

<button
id="logoutButton"
class="logout"
>
Déconnexion
</button>

</header>


<div class="layout">

<nav>

<button
data-page="dashboard"
>
🏠 Accueil
</button>

<button
data-page="clients"
>
👥 Clients
</button>

<button
data-page="services"
>
🛠️ Services
</button>

<button
data-page="factures"
>
🧾 Factures
</button>

<button
data-page="paiements"
>
💳 Paiements
</button>

</nav>


<main>

<!-- DASHBOARD -->

<section
id="dashboard"
class="page active"
>

<h2>
Tableau de bord
</h2>

<div class="cards">

<div class="card">

<h3>
Clients
</h3>

<div
id="clientCount"
class="stat"
>
0
</div>

</div>


<div class="card">

<h3>
Services
</h3>

<div
id="serviceCount"
class="stat"
>
0
</div>

</div>


<div class="card">

<h3>
Factures
</h3>

<div
id="factureCount"
class="stat"
>
0
</div>

</div>


<div class="card">

<h3>
Paiements
</h3>

<div
id="paiementCount"
class="stat"
>
0
</div>

</div>

</div>

</section>


<!-- CLIENTS -->

<section
id="clients"
class="page"
>

<div class="top">

<h2>
Clients
</h2>

<button
id="addClientButton"
class="add"
>
+ Ajouter
</button>

</div>

<input
id="clientSearch"
class="search"
type="search"
placeholder="Rechercher..."
>

<div
id="clientsList"
class="cards"
>
</div>

</section>


<!-- SERVICES -->

<section
id="services"
class="page"
>

<div class="top">

<h2>
Services
</h2>

<button
id="addServiceButton"
class="add"
>
+ Ajouter
</button>

</div>

<div
id="servicesList"
class="cards"
>
</div>

</section>


<!-- FACTURES -->

<section
id="factures"
class="page"
>

<div class="top">

<h2>
Factures
</h2>

<button
id="addFactureButton"
class="add"
>
+ Ajouter
</button>

</div>

<div
id="facturesList"
class="cards"
>
</div>

</section>


<!-- PAIEMENTS -->

<section
id="paiements"
class="page"
>

<div class="top">

<h2>
Paiements
</h2>

<button
id="addPaiementButton"
class="add"
>
+ Ajouter
</button>

</div>

<div
id="paiementsList"
class="cards"
>
</div>

</section>

</main>

</div>

</section>


<!-- MODALE CLIENT -->

<div
id="clientModal"
class="modal"
>

<div class="modalBox">

<h2 id="clientModalTitle">
Ajouter un client
</h2>

<input
id="clientId"
type="hidden"
>

<div class="formGroup">

<label>
Nom
</label>

<input
id="clientNom"
type="text"
required
>

</div>

<div class="formGroup">

<label>
Téléphone
</label>

<input
id="clientTelephone"
type="text"
>

</div>

<div class="formGroup">

<label>
E-mail
</label>

<input
id="clientEmail"
type="email"
>

</div>

<div class="formGroup">

<label>
Adresse
</label>

<input
id="clientAdresse"
type="text"
>

</div>

<div class="formGroup">

<label>
Entreprise
</label>

<input
id="clientEntreprise"
type="text"
>

</div>

<div
id="clientFormMessage"
class="message"
></div>

<div class="modalButtons">

<button
id="saveClientButton"
class="save"
>
Enregistrer
</button>

<button
data-close="clientModal"

type="button"
>
Annuler
</button>

</div>

</div>

</div>


<!-- MODALE SERVICE -->

<div
id="serviceModal"
class="modal"
>

<div class="modalBox">

<h2>
Ajouter un service
</h2>

<div class="formGroup">

<label>
Nom
</label>

<input
id="serviceNom"
type="text"
>

</div>

<div class="formGroup">

<label>
Description
</label>

<textarea
id="serviceDescription"
rows="4"
></textarea>

</div>

<div class="formGroup">

<label>
Prix
</label>

<input
id="servicePrix"
type="number"
step="0.01"
>

</div>

<div
id="serviceFormMessage"
class="message"
></div>

<div class="modalButtons">

<button
id="saveServiceButton"
class="save"
>
Enregistrer
</button>

<button
data-close="serviceModal"
class="cancel"
type="button"
>
Annuler
</button>

</div>

</div>

</div>


<!-- MODALE FACTURE -->

<div
id="factureModal"
class="modal"
>

<div class="modalBox">

<h2>
Ajouter une facture

<div class="formGroup">

<label>
Client
</label>

<select
id="factureClient"
></select>

</div>

<div class="formGroup">

<label>
Numéro
</label>

<input
id="factureNumero"
type="text"
>

</div>

<div class="formGroup">

<label>
Montant

<input
id="factureMontant"

step="0.01"
>

</div>

Statut

En attente

Payée

Annulée

<input

>

Date échéance

<input
id="factureEcheance"

>

</div>

<div
id="factureFormMessage"

></div>

<div class="modalButtons">

<button
id="saveFactureButton"
class="save"
>
Enregistrer
</button>

<button
data-close="factureModal"
class="cancel"
type="button"
>
Annuler
</button>

</div>

</div>

</div>


<!-- MODALE PAIEMENT -->

<div

>

<div class="modalBox">

<h2>
Ajouter un paiement
</h2>

<div class="formGroup">

<label>
Client
</label>

<select
id="paiementClient"
></select>

</div>

<div class="formGroup">

<label>
Facture
</label>

<select
id="paiementFacture"
></select>

</div>

<div class="formGroup">

<label>
Montant
</label>

<input
id="paiementMontant"
type="number"
step="0.01"
>

</div>

<div class="formGroup">

<label>
Date paiement
</label>

<input
id="paiementDate"
type="date"
>

</div>

<div class="formGroup">

<label>
Référence
</label>

<input
id="paiementReference"
type="text"
>

</div>

<div
id="paiementFormMessage"
class="message"
></div>

<div class="modalButtons">

<button
id="savePaiementButton"

>
Enregistrer

>
Annuler
</button>

</div>

</div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"

<script src="./app.js"></script>

</body>
</html>
